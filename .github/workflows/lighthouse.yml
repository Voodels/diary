name: lighthouse

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Lighthouse against live site
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://voodels.github.io/diary/
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Scores in run summary
        if: always()
        shell: bash
        run: |
          echo "## Lighthouse — live site" >> "$GITHUB_STEP_SUMMARY"
          for f in lighthouse-results/lighthouse-report-*.json; do
            [ -e "$f" ] || f=$(find lighthouse-results -name "*.json" | head -1)
            [ -e "$f" ] || continue
            jq -r '.categories | to_entries[] | "- \( .key ): \( (.value.score * 100) | round )/100"' "$f" >> "$GITHUB_STEP_SUMMARY" || true
          done
