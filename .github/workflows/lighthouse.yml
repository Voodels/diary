name: lighthouse

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Lighthouse against live site
        id: lh
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: https://voodels.github.io/diary/
          uploadArtifacts: true
          temporaryPublicStorage: false

      - name: Scores in run summary
        if: always()
        shell: bash
        run: |
          echo "## Lighthouse — live site" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.lh.outputs.scores }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
